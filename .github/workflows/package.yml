name: Package

# The packaged app for each platform (U84, FF-244): built on its own runner,
# since pnpm installs sharp's native files only for the machine it runs on
# (D110), then checked from outside by the packaged-app journey. Called by CI
# on every push and pull request, and by Release, which publishes what it
# uploads. Intel Macs, Windows and Linux add their rows (FF-161, FF-197, FF-198).

on:
  workflow_call:
    inputs:
      release:
        description: Building what will be published, so nothing comes from a cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment gives the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release installs afresh: a cache could hold something a release
      # shouldn't ship.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: ${{ !inputs.release }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      # Builds the UI, then FilmFile.app and FilmFile-<version>-<platform>.dmg in apps/desktop/out.
      - run: pnpm package

      - run: pnpm exec playwright test --project packaged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilmFile-${{ matrix.platform }}
          path: apps/desktop/out/FilmFile-*.dmg
          if-no-files-found: error
          retention-days: 7
